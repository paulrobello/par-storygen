[project]
name = "par-storygen"
dynamic = [
    "version",
]
description = "AI-driven TUI choose-your-own-adventure"
readme = "README.md"
url = "https://github.com/paulrobello/par-storygen"
authors = [
    { name = "Paul Robello", email = "probello@gmail.com" },
]
maintainers = [
    { name = "Paul Robello", email = "probello@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Other Audience",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Topic :: Terminals",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
keywords = [
    "storygen",
    "choose-your-own-adventure",
    "interactive-fiction",
    "openai",
    "ollama",
    "openrouter",
    "gemini",
    "llm",
    "ai",
    "terminal",
    "tui",
    "textual",
]
requires-python = ">=3.13"
dependencies = [
    "textual>=8.2.7",
    "pydantic>=2.9",
    "pydantic-ai>=1.99.0",
    "openai>=2.37.0",
    "rich>=15.0.0",
    "par-textual-image>=0.1.0",
    "typer>=0.25.1",
    "xdg-base-dirs>=6.0.2",
    "httpx>=0.28.1",
    "pillow>=12.2.0",
    "tenacity>=9.1.4",
    "python-dotenv>=1.2.2",
    "jinja2>=3.1.6",
    "google-genai>=2.4.0",
    "textual-pyfiglet>=1.0.0",
    "par-cli-tts>=0.5.1",
]
packages = [
    "src/storygen",
]

[project.license]
file = "LICENSE"

[project.urls]
Homepage = "https://github.com/paulrobello/par-storygen"
Documentation = "https://github.com/paulrobello/par-storygen/blob/main/README.md"
Source = "https://github.com/paulrobello/par-storygen"
Issues = "https://github.com/paulrobello/par-storygen/issues"
Discussions = "https://github.com/paulrobello/par-storygen/discussions"

[project.scripts]
storygen = "storygen.main:app"
storygen-api = "storygen_api.main:cli"

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.13",
    "pyright>=1.1.409",
    "pre-commit>=4.6.0",
    "hatchling>=1.29.0",
]

[tool.hatch.version]
path = "src/storygen/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/storygen",
    "src/storygen_api",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/storygen",
    "src/storygen_api",
    "web",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
exclude = [
    "*.pyc",
    "__pycache__",
    "*.so",
    "*.dylib",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = [
    "src",
    "tests",
]
exclude = [
    "web",
]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
timeout = 10

[tool.uv.sources]
