# ARC-006: continuous integration gate for push and pull_request.
#
# `make checkall` is the authoritative read-only gate (ARC-008 split `fmt`
# out so formatting drift surfaces instead of being auto-fixed mid-run).
# We `uv sync --extra api` because the FastAPI / WebSocket tests in
# tests/unit/test_api_*.py and tests/integration/test_api_full_flow.py
# import fastapi / starlette / websockets from the optional `[api]` extra.
# `make web-build` type-checks the Next.js frontend (pyright excludes web/).
#
# Matrix is Python 3.13 only — pyproject.toml's `requires-python = ">=3.13"`
# allows 3.14 and the classifier lists it, but the toolchain (ruff
# `target-version = "py313"`, pyright `pythonVersion = "3.13"`) is pinned to
# 3.13. Add 3.14 here only after the lint/typecheck targets are bumped.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-gate:
    name: Python (lint + typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      # `[api]` pulls fastapi / uvicorn[standard] / websockets / python-multipart
      # which the API + WS tests import. `--dev` brings in pytest, ruff, pyright.
      - name: Sync dependencies (with api extra)
        run: uv sync --extra api --dev

      - name: Run read-only gate (lint + typecheck + test)
        run: make checkall

  web-build:
    name: Web (vitest + next build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` requires a package-lock.json. If the lockfile is missing the
      # frontend job fails loudly rather than silently drifting.
      - name: Install frontend dependencies
        run: npm ci

      # ARC-015: vitest layer for the WS event contract + config module.
      # QA-004: lint the web surface in CI (vitest + next build cover test + tsc).
      - name: Lint (eslint)
        run: npm run lint

      - name: Run vitest
        run: npm run test

      - name: Build Next.js
        run: npm run build

  # ARC-015: hermetic Playwright e2e. REST + WebSocket are mocked in-test, so
  # this needs no live FastAPI/LLM backend — only Chromium and the Next dev
  # server (booted by Playwright's webServer). Runs in parallel with the jobs
  # above, so it does not extend the critical path.
  web-e2e:
    name: Web (Playwright e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # `--with-deps` installs the OS shared libs Chromium needs on ubuntu.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: npm run e2e
