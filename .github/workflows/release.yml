name: Build, Test, and Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint and Typecheck
        run: make checkall

      - name: Package
        run: make package

      - name: Get version
        id: get_version
        run: |
          version=$(uv run python -c "from storygen import __version__; print(__version__)")
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  tag:
    name: Tag Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Get version
        run: |
          uv sync --all-extras --dev
          version=$(uv run python -c "from storygen import __version__; print(__version__)")
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or update tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags
          git tag -d "v$VERSION" 2>/dev/null || true
          git push --delete origin "v$VERSION" 2>/dev/null || true
          git tag -a "v$VERSION" -m "Version $VERSION"
          git push origin "v$VERSION"

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/p/par-storygen
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Get version
        run: |
          version=$(uv run python -c "from storygen import __version__; print(__version__)")
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@v0.4.0
        with:
          args: 'The project {{ EVENT_PAYLOAD.repository.full_name }} ${{ env.VERSION }} has been published to TestPyPI.'
        continue-on-error: true

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, tag]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Get version
        run: |
          version=$(uv run python -c "from storygen import __version__; print(__version__)")
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.3.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create \
          'release-v${{ env.VERSION }}' \
          dist/** \
          --repo '${{ github.repository }}' \
          --generate-notes \
          --latest

      - name: Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@v0.4.0
        with:
          args: 'A new release v${{ env.VERSION }} has been created for {{ EVENT_PAYLOAD.repository.full_name }}.'

      - name: Cleanup on failure
        if: failure()
        run: |
          gh release delete 'release-v${{ env.VERSION }}' --yes || true
          rm -rf dist/ || true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [publish-testpypi, github-release]
    environment:
      name: pypi
      url: https://pypi.org/p/par-storygen
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Get version
        run: |
          version=$(uv run python -c "from storygen import __version__; print(__version__)")
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0

      - name: Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@v0.4.0
        with:
          args: 'The project {{ EVENT_PAYLOAD.repository.full_name }} ${{ env.VERSION }} has been published to PyPI.'
        continue-on-error: true
